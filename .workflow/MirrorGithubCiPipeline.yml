# Gitee Go pipeline: mirror GitHub Actions results (artifacts + full logs) for
# the pushed commit into this repository's Gitee Go artifact repository.
#
# Gitee Go build environments are Linux-only, so iOS builds cannot run here;
# instead this pipeline watches the GitHub CI that already ran for the same
# commit and clones its outputs. It triggers on pushes to main (i.e. when the
# mirror syncs a commit) and hourly as a backstop for missed pushes.

version: '1.0'
name: mirror-github-ci
displayName: 同步 GitHub CI 构建产物与日志

triggers:
  push:
    branches:
      precise:
        - main
        - master
  schedule:
    # 每小时第 37 分兜底一次, 防止镜像推送时机与 GitHub CI 完成时机错开
    - cron: '0 37 * * * ?'

variables:
  MAX_WAIT_MINUTES: '90'

stages:
  - stage: mirror
    displayName: 拉取 GitHub CI 产物
    strategy: fast
    trigger: auto
    steps:
      # build@gradle only lends its cloud shell environment; no Gradle/ JDK is
      # actually used by the mirror script (bash + curl + python3 + unzip).
      - step: build@gradle
        name: mirror_github
        displayName: 轮询 GitHub CI 并下载产物与日志
        jdkVersion: 17
        gradleVersion: 8.9
        commands:
          - bash .workflow/mirror_github_artifacts.sh
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./github-ci-mirror
      - step: publish@general_artifacts
        name: publish_mirror
        displayName: 上传到 Gitee 制品库
        dependArtifact: BUILD_ARTIFACT
        artifactRepository: default
        artifactName: github-ci-mirror
