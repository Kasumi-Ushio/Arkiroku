name: iOS CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'internalResources/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios-test.yml'
      - '.github/workflows/android-test.yml'
      - '.github/workflows/cache-cleanup.yml'
      - '.workflow/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'internalResources/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios-test.yml'
      - '.github/workflows/android-test.yml'
      - '.github/workflows/cache-cleanup.yml'
      - '.workflow/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-debug:
    # macos-latest (currently macos-26, default Xcode 26.6): floats to macOS 27
    # once GitHub promotes it, so no label change is needed for the transition.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Gradle Setup
        uses: ./.github/actions/gradle-setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore Kotlin/Native cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build Debug framework and resources
        run: |
          ./gradlew \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:linkDebugFrameworkIosArm64 \
            :composeApp:iosArm64AggregateResources

      - name: Upload Debug device frameworks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-device-frameworks-debug
          path: composeApp/build/bin/iosArm64/**
          if-no-files-found: error

      - name: Upload Debug device compose resources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-device-compose-resources-debug
          path: composeApp/build/kotlin-multiplatform-resources/aggregated-resources/iosArm64/**
          if-no-files-found: error

      - name: Prepare Xcode DerivedData cache directory
        run: mkdir -p "$RUNNER_TEMP/DerivedDataDebug"

      - name: Xcode cache
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: xcode-debug-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj', 'iosApp/iosApp.xcodeproj/xcshareddata/xcschemes/*.xcscheme', 'iosApp/iosApp/**/*.swift', 'iosApp/iosApp/**/*.plist') }}
          restore-keys: |
            xcode-debug-${{ runner.os }}-
            xcode-debug-
          deriveddata-directory: ${{ runner.temp }}/DerivedDataDebug
          delete-used-deriveddata-cache: false

      - name: Build iosApp (Debug)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDebug" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            FRAMEWORK_SEARCH_PATHS="$(pwd)/composeApp/build/bin/iosArm64/debugFramework" \
            OTHER_LDFLAGS="-framework ComposeApp" \
            build

      - name: Copy Compose resources into Debug app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataDebug/Build/Products/Debug-iphoneos/Phi Tracker.app"
          RESOURCE_ROOT="$(pwd)/composeApp/build/kotlin-multiplatform-resources/aggregated-resources/iosArm64"
          test -d "$RESOURCE_ROOT/composeResources"
          mkdir -p "$APP_PATH/compose-resources"
          rm -rf "$APP_PATH/compose-resources/composeResources"
          cp -R "$RESOURCE_ROOT/composeResources" "$APP_PATH/compose-resources/"
          test -f "$APP_PATH/compose-resources/composeResources/phitracker.composeapp.generated.resources/files/aboutlibraries.json"

      - name: Package unsigned Debug IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataDebug/Build/Products/Debug-iphoneos/Phi Tracker.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "PhiTracker-Debug.ipa" Payload
          rm -rf Payload

      - name: Upload Debug IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-debug-ipa
          path: PhiTracker-Debug.ipa
          if-no-files-found: error

  ios-release:
    # macos-latest (currently macos-26, default Xcode 26.6): floats to macOS 27
    # once GitHub promotes it, so no label change is needed for the transition.
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Gradle Setup
        uses: ./.github/actions/gradle-setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore Kotlin/Native cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build Release framework and resources
        run: |
          ./gradlew \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:linkReleaseFrameworkIosArm64 \
            :composeApp:iosArm64AggregateResources

      - name: Upload Release device frameworks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-device-frameworks-release
          path: composeApp/build/bin/iosArm64/**
          if-no-files-found: error

      - name: Upload Release device compose resources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-device-compose-resources-release
          path: composeApp/build/kotlin-multiplatform-resources/aggregated-resources/iosArm64/**
          if-no-files-found: error

      - name: Prepare Xcode DerivedData cache directory
        run: mkdir -p "$RUNNER_TEMP/DerivedDataRelease"

      - name: Xcode cache
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: xcode-release-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj', 'iosApp/iosApp.xcodeproj/xcshareddata/xcschemes/*.xcscheme', 'iosApp/iosApp/**/*.swift', 'iosApp/iosApp/**/*.plist') }}
          restore-keys: |
            xcode-release-${{ runner.os }}-
            xcode-release-
          deriveddata-directory: ${{ runner.temp }}/DerivedDataRelease
          delete-used-deriveddata-cache: false

      - name: Build iosApp (Release)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            FRAMEWORK_SEARCH_PATHS="$(pwd)/composeApp/build/bin/iosArm64/releaseFramework" \
            OTHER_LDFLAGS="-framework ComposeApp" \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            build

      - name: Copy Compose resources into Release app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release-iphoneos/Phi Tracker.app"
          RESOURCE_ROOT="$(pwd)/composeApp/build/kotlin-multiplatform-resources/aggregated-resources/iosArm64"
          test -d "$RESOURCE_ROOT/composeResources"
          mkdir -p "$APP_PATH/compose-resources"
          rm -rf "$APP_PATH/compose-resources/composeResources"
          cp -R "$RESOURCE_ROOT/composeResources" "$APP_PATH/compose-resources/"
          test -f "$APP_PATH/compose-resources/composeResources/phitracker.composeapp.generated.resources/files/aboutlibraries.json"

      - name: Package unsigned Release IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataRelease/Build/Products/Release-iphoneos/Phi Tracker.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "PhiTracker-Release.ipa" Payload
          rm -rf Payload

      - name: Upload Release IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-ipa
          path: PhiTracker-Release.ipa
          if-no-files-found: error
